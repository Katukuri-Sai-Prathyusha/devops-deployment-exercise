name: Docker Build Push and Deploy Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build Docker image
        run: docker build -t katukurisaiprathyusha/devops-app:latest .

      - name: Push Docker image
        run: docker push katukurisaiprathyusha/devops-app:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            sudo docker pull katukurisaiprathyusha/devops-app:latest
            sudo docker stop devops-app || true
            sudo docker rm devops-app || true
            sudo docker run -d --name devops-app -p 5000:5000 katukurisaiprathyusha/devops-app:latest
